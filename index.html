  <!-- CUSTOM CSS -->
  <style amp-custom>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #010c1a;
      --green: #59e86c;
      --white: #ffffff;
      --radius: 16px;
      --padding: 16px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #0e0000;
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: 94%;
      max-width: 720px;
      margin: 22px auto 36px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 200px;
      margin: 20px auto 10px;
    }

    .panel {
      width: 100%;
      padding: var(--padding);
      background: linear-gradient(to bottom, #59e86c, #000000);
      border-radius: 20px;
      box-shadow:
        0 10px 24px rgba(89,232,108,0.4),
        inset 0 0 0 3px rgb(223,209,7);
    }

    .banner {
      width: 100%;
      margin-bottom: 14px;
      overflow: hidden;
      border-radius: 14px;
      box-shadow: 0 0 0 2px #ffffff;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ffffff;
      border-radius: var(--radius);
      background: var(--green);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.2px;
      text-align: center;
      box-shadow: 0 0 14px rgba(61,5,5,0.35);
    }

    .btn:hover {
      background: #43c957;
    }

    .footer {
      margin-top: 12px;
      color: var(--green);
      font-size: 13px;
      line-height: 1.6;
    }

    .footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (min-width: 600px) {
      .logo {
        width: 240px;
      }

      .panel {
        padding: 18px;
      }
    }

    @media (min-width: 992px) {
      .logo {
        width: 280px;
      }

      .panel {
        padding: 20px;
      }
    }
  </style>
</head>

  <main class="wrap">

        PAUS123
      </a>
    </footer>

  </main>

</body>
